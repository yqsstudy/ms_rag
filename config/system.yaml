# System Configuration

# Embedding settings
embedding:
  model: "BAAI/bge-large-zh"
  device: "cpu"  # cpu | cuda | mps
  batch_size: 32
  normalize: true

# Vector store settings
vector_store:
  type: "chroma"
  persist_directory: "./data/chroma"
  collection_name: "performance_guide"

# Keyword index settings
keyword_index:
  type: "bm25"
  k1: 1.5
  b: 0.75

# Retrieval settings
retrieval:
  vector_weight: 0.6
  keyword_weight: 0.4
  top_k: 10
  rerank: true
  reranker_mode: "heuristic"
  reranker_model: "BAAI/bge-reranker-base"
  reranker_fallback: "heuristic"

# LLM settings
llm:
  provider: "${LLM_PROVIDER:anthropic}"  # anthropic | openai | deepseek
  model: "${LLM_MODEL:claude-sonnet-4-6}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:}"  # Custom API base URL (for proxy or compatible APIs)
  max_tokens: 2000
  temperature: 0.7
  timeout: 60

# API settings
api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_origins:
    - "*"

# Document processing settings
document:
  min_chunk_size: 1500
  max_chunk_size: 2000
  chunk_overlap: 200

# Logging settings
logging:
  level: "INFO"
  format: "json"
  file: "./logs/app.log"

# Cache settings
cache:
  enabled: true
  l1_max_size: 1000
  l1_ttl: 3600
  l2_max_size: 500
  l2_ttl: 1800
  l2_threshold: 0.92
  l3_max_size: 2000
  l3_ttl: 7200

# Knowledge graph settings
knowledge_graph:
  enabled: true
  graph_path: "./data/graph.json"
  expand_parent: true
  expand_sibling: true
  expand_child: true
  expand_reference: true
  max_expand_per_direction: 1
  max_enhanced_results: 3
  expand_weight_parent: 0.5
  expand_weight_sibling: 0.3
  expand_weight_child: 0.3
  expand_weight_reference: 0.4
  related_topics_count: 5
