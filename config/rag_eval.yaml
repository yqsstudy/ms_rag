paths:
  corpus_dir: "./corpus"
  output_dir: "./data/eval"
  system_config: "./config/system.yaml"
  raw_response_dir: "./data/eval/raw_llm"

llm:
  provider: openai_compatible
  base_url: "${RAG_EVAL_OPENAI_BASE_URL:${OPENAI_BASE_URL}}"
  api_key: "${RAG_EVAL_OPENAI_API_KEY:${OPENAI_API_KEY}}"
  model: "${RAG_EVAL_OPENAI_MODEL:${OPENAI_MODEL:gpt-4o-mini}}"
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 180
  max_retries: 3
  retry_backoff_seconds: 2
  save_raw_response: true

question_generation:
  enabled_scopes: [chunk, section, document]
  questions_per_chunk: 2
  chunk_questions_per_item: 2
  section_questions_per_item: 1
  document_questions_per_item: 1
  max_chunks: 200
  max_sections: 50
  max_documents: 30
  min_chunk_chars: 200
  min_section_chars: 600
  min_document_chars: 1200
  allowed_types: [concept, how_to, troubleshooting, parameter, comparison, limitation]

candidate_pool:
  neighbor_window: 2
  same_section_limit: 8
  bm25_top_k: 50
  vector_top_k: 50
  title_match_top_k: 10

card_filter:
  max_cards_per_question: 10
  snippet_chars: 240
  max_chunks_per_source: 5
  bm25_weight: 0.35
  vector_weight: 0.35
  title_match_bonus: 0.1
  same_doc_bonus: 0.1
  seed_neighbor_bonus: 0.1

llm_judge:
  relevance_threshold: 2
  batch_size: 20

synthesis:
  max_supporting_chunks: 8
  max_chunk_chars: 1200
  max_must_have_points: 5
  max_nice_to_have_points: 5

review:
  sample_size: 50
  random_seed: 42
  stratify_by: [question_type, difficulty]

evaluation:
  dataset_path: "./data/eval/eval_dataset.jsonl"
  top_k: [1, 3, 5, 10]
  run_generation: false
  run_llm_judge: false
  compare_configs: []
